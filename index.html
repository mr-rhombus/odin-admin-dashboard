<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/img/view-dashboard.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="logo">
          <img src="assets/img/dashboard-outline.svg" alt="Dashboard icon" />
          <div>Dashboard</div>
        </div>
        <div class="menu main-menu">
          <ul>
            <li>
              <img src="assets/img/home-outline.svg" alt="" />
              <a href="">Home</a>
            </li>
            <li>
              <img src="assets/img/id-card-outline.svg" alt="" />
              <a href="">Profile</a>
            </li>
            <li>
              <img src="assets/img/chat-bubble-outline.svg" alt="" />
              <a href="">Messages</a>
            </li>
            <li>
              <img src="assets/img/clock-outline.svg" alt="" />
              <a href="">History</a>
            </li>
            <li>
              <img src="assets/img/check-circle-outline.svg" alt="" />
              <a href="">Tasks</a>
            </li>
            <li>
              <img src="assets/img/group-outline.svg" alt="" />
              <a href="">Communities</a>
            </li>
          </ul>
        </div>
        <div class="menu support-menu">
          <ul>
            <li>
              <img src="assets/img/settings-outline.svg" alt="" />
              <a href="">Settings</a>
            </li>
            <li>
              <img src="assets/img/headset-outline.svg" alt="" />
              <a href="">Support</a>
            </li>
            <li>
              <img src="assets/img/shield-outline.svg" alt="" />
              <a href="">Privacy</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="banner">
        <div class="banner-top">
          <div class="banner-search">
            <img src="assets/img/search-outline.svg" alt="" />
            <input type="search" name="" id="" />
          </div>
          <div class="banner-profile">
            <a href="" class="shadow-hover"
              ><img src="assets/img/notif-outline.svg" alt=""
            /></a>
            <div class="profile-round pointer">
              <img src="assets/img/slakoth.png" alt="" />
            </div>
            <div class="username pointer">Slakoth</div>
          </div>
        </div>
        <div class="banner-bottom"></div>
      </div>
      <div class="content"></div>
    </div>
  </body>
</html>
